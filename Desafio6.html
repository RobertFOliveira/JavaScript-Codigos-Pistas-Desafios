<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAÇA AO TESOURO</title>
    <form></form>
</head>

<body>
    <h1 style="color: blue;">CAÇA AO TESOURO</h1>
    <form action="Aula Formulario2.html" method="POST" enctype="multipart/form-data">


        <fieldset>
            <div>
                <label for="Pista 10">Desafio 10</label><br>
                <label for="Soma1">Complete a frase com a palavra que melhor se encaixa: O sol _____ (brilha, brilhava,
                    brilhou) no céu durante o dia</label><br>
                <br>
                <label for="V">brilha</label>
                <input type="radio" name="Soma1" value="brilha">
                <label for="F">brilhava</label>
                <input type="radio" name="Soma1" value="brilhava">
                <label for="F">brilhou</label>
                <input type="radio" name="Soma1" value="brilhou">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 11">Desafio 11</label><br>
                <label for="Soma2">Maiara fez uma avaliação de Matemática onde cada questão valia 3 pontos. Sabendo que
                    ela acertou 16 questões, qual foi a pontuação de Maiara?</label><br>
                <br>
                <label for="F">36</label>
                <input type="radio" name="Soma2" value="36">
                <label for="F">42</label>
                <input type="radio" name="Soma2" value="42">
                <label for="V">48</label>
                <input type="radio" name="Soma2" value="48">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 12">Desafio 12</label><br>
                <label for="Soma3">Complete a frase com a palavra que melhor se encaixa: No final de semana, nós _____
                    (assistir, assistimos, assiste) a um filme juntos.</label><br>
                <br>
                <label for="V">assistimos</label>
                <input type="radio" name="Soma3" value="assistimos">
                <label for="F">assistir</label>
                <input type="radio" name="Soma3" value="assistir">
                <label for="F">assiste</label>
                <input type="radio" name="Soma3" value="assiste">
                <br>
            </div>
            <br>
            <button type="button" onclick="Pista10()">Mostrar Resposta</button>
        </fieldset>

    </form>
    <script src="Desafio6.js"></script>

</body>

</html>
