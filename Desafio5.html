<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAÇA AO TESOURO</title>
    <form></form>
</head>

<body>
    <h1 style="color: blue;">CAÇA AO TESOURO</h1>
    <form action="Aula Formulario2.html" method="POST" enctype="multipart/form-data">

        <fieldset>
            <div>
                <label for="Pista 7">Desafio 7</label><br>
                <label for="Soma1">Um carro percorre 60 km em 1 hora. Quantos quilômetros ele percorrerá em 4
                    horas?</label><br>
                <br>
                <label for="F">200</label>
                <input type="radio" name="Soma1" value="200">
                <label for="V">240</label>
                <input type="radio" name="Soma1" value="240">
                <label for="F">220</label>
                <input type="radio" name="Soma1" value="220">
                <br>
            </div>
            <br>
        </fieldset>

        <fieldset>
            <div>
                <label for="Pista 8">Desafio 8</label><br>
                <label for="Soma2">Complete a frase com a palavra que melhor se encaixa: Hoje estou _____ (feliz,
                    felizmente, felicidade) porque ganhei um presente.</label><br>
                <br>
                <label for="V">feliz</label>
                <input type="radio" name="Soma2" value="feliz">
                <label for="F">felizmente</label>
                <input type="radio" name="Soma2" value="felizmente">
                <label for="F">felicidade</label>
                <input type="radio" name="Soma2" value="felicidade">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 9">Desafio 9</label><br>
                <label for="Soma3">Pedro tem 120 canetas e quer dividir igualmente entre seus 4 amigos. Quantas canetas
                    cada amigo receberá?</label><br>
                <br>
                <label for="V">30</label>
                <input type="radio" name="Soma3" value="30">
                <label for="F">40</label>
                <input type="radio" name="Soma3" value="40">
                <label for="F">20</label>
                <input type="radio" name="Soma3" value="20">
                <br>
            </div>
            <br>
            <button type="button" onclick="Pista7()">Mostrar Resposta</button>
        </fieldset>

    </form>
    <script src="Desafio5.js"></script>

</body>

</html>
