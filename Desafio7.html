<!DOCTYPE html>

<body>
    <h1 style="color: blue;">CAÇA AO TESOURO</h1>
    <form action="Aula Formulario2.html" method="POST" enctype="multipart/form-data">

        <fieldset>
            <div>
                <label for="Pista 14">Desafio 14</label><br>
                <label for="Soma1">Caio é taxista e cobra a viagem de acordo com a quilometragem percorrida. Sabendo que
                    ele cobra R$3,70 a cada quilômetro rodado, quanto ele vai receber se fizer uma corrida de 20
                    km?</label><br>
                <br>
                <label for="F">72</label>
                <input type="radio" name="Soma1" value="72">
                <label for="F">76</label>
                <input type="radio" name="Soma1" value="76">
                <label for="V">74</label>
                <input type="radio" name="Soma1" value="74">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 15">Desafio 15</label><br>
                <label for="Soma2">Atualmente, cada brasileiro produz cerca de 640 quilos de lixo em 2 anos. Diante
                    desta informação, quantos quilos de lixo produz cada morador em um ano?</label><br>
                <br>
                <label for="F">220</label>
                <input type="radio" name="Soma2" value="220">
                <label for="V">320</label>
                <input type="radio" name="Soma2" value="320">
                <label for="F">240</label>
                <input type="radio" name="Soma2" value="240">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 16">Desafio 16</label><br>
                <label for="Soma3">Júlia vende biscoitos e em cada cesta ela coloca 13 pacotinhos de biscoitos. Após
                    preparar 4 cestas, quantos pacotinhos de biscoito ela havia distribuído?</label><br>
                <br>
                <label for="F">72</label>
                <input type="radio" name="Soma3" value="72">
                <label for="F">44</label>
                <input type="radio" name="Soma3" value="44">
                <label for="V">52</label>
                <input type="radio" name="Soma3" value="52">
                <br>
            </div>
            <br>
            <button type="button" onclick="Pista14()">Mostrar Resposta</button>
        </fieldset>

    </form>
