<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Tesouro</title>

</head>
<body>
    <h1 style="color: blue;">CAÇA AO TESOURO</h1>

    <fieldset>
        <div class="desafio">
            <label for="Pista 19">Desafio 19</label><br>
            <label for="Soma1">Uma fábrica de Joinville funciona em três turnos. Trabalham no 1º turno, 3.027
                funcionários; no 2º turno, 2.317 funcionários e no 3º turno, 1.203 funcionários. Quantos
                funcionários trabalham nessa fábrica? </label><br>
            <br>
            <label for="F">5.547</label>
            <input type="radio" name="Soma1" id="5.547" value="5.547">
            <label for="V">6.547</label>
            <input type="radio" name="Soma1" id="6.547" value="6.547">
            <label for="F">6.047</label>
            <input type="radio" name="Soma1" id="6.047" value="6.047">
            <br>
        </div>
        <br>
        <button type="button" onclick="Pista19()">Mostrar Resposta</button>
    </fieldset>



    <fieldset>
        <div class="desafio">

            <label for="Pista 20">Desafio 20</label><br>
            <label for="Soma2">Em uma caixa de supermercado há 126 maçãs e 269 limões. Quantas frutas há na
                caixa?</label><br>
            <br>
            <label for="V">395</label>
            <input type="radio" name="Soma2" id="395" value="395">
            <label for="F">393</label>
            <input type="radio" name="Soma2" id="393" value="393">
            <label for="F">385</label>
            <input type="radio" name="Soma2" id="385" value="385">
            <br>
        </div>
        <br>
        <button type="button" onclick="Pista20()">Mostrar Resposta</button>
    </fieldset>

    <fieldset>
        <div class="desafio">
            <label for="Pista 21">Desafio 21</label><br>
            <label for="Soma3"> Dom Pedro II, imperador do Brasil, faleceu em 1891 com 66 anos de idade. Em que
                ano
                ele
                nasceu?</label><br>
            <br>
            <label for="F">1835</label>
            <input type="radio" name="Soma3" id="1835" value="1835">
            <label for="F">1845</label>
            <input type="radio" name="Soma3" id="1845" value="1845">
            <label for="V">1825</label>
            <input type="radio" name="Soma3" id="1825" value="1825">
            <br>
        </div>
    
        <button type="button" onclick="Pista21()">Mostrar Resposta</button>
    </fieldset>
