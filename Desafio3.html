<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAÇA AO TESOURO</title>
</head>
<body style="background-color:rgb(229, 233, 191);margin: auto; width: 500px; height: auto;">

    <h1 style="color: blue;">CAÇA AO TESOURO</h1>
    <form action="Aula Formulario2.html" method="POST" enctype="multipart/form-data">
        <fieldset>
            <div style="font-family: Arial, Helvetica, sans-serif; color: black;">
                <label for="Pista 1">Desafio 1</label><br>
                <label for="Soma1">Em uma escola, há 1.327 alunos estudando no turno da manhã e 542 estudando no turno
                    da tarde. Quantos alunos há nesta escola no total?</label><br>
                <br>
                <label for="V">1.869</label>
                <input type="radio" id="1" name="Soma1" value="1.869">
                <label for="F">2.869</label>
                <input type="radio" id="2" name="Soma1" value="2.869">
                <label for="F">1.569</label>
                <input type="radio" id="3" name="Soma1" value="1.569">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>

                <label for="Pista 1">Desafio 2</label><br>
                <label for="Soma2">Um padeiro fez 35 pães. No final do dia, sobraram 12 pães. Quantos pães foram
                    vendidos?</label><br>
                <br>
                <label for="F">57</label>
                <input type="radio" name="Soma2" value="57">
                <label for="V">47</label>
                <input type="radio" name="Soma2" value="47">
                <label for="F">37</label>
                <input type="radio" name="Soma2" value="37">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 3">Desafio 3</label><br>
                <label for="Soma3">Complete a frase com verbo no passado: Ontem, eu _____ (fui, vou, ia) ao parque com
                    meus amigos.</label><br>
                <br>
                <label for="V">fui</label>
                <input type="radio" name="Soma3" value="fui">
                <label for="F">vou</label>
                <input type="radio" name="Soma3" value="vou">
                <label for="F">ia</label>
                <input type="radio" name="Soma3" value="ia">
                <br>
            </div>
            <br>
            <button type="button" onclick="Pista1()">Mostrar Resposta</button>
            <br>
        </fieldset>

    </form>
    <script src="Desafio3.js"></script>

</body>

</html>
