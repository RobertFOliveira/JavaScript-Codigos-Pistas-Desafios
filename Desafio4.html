<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAÇA AO TESOURO</title>
    <form></form>
</head>

<body>
    <h1 style="color: blue;">CAÇA AO TESOURO</h1>
    <form action="Aula Formulario2.html" method="POST" enctype="multipart/form-data">

        <fieldset>
            <div>
                <label for="Pista 4">Desafio 4</label><br>
                <label for="Soma1">Uma caixa contém 7 maçãs e João comprou 9 caixas. Quantas maçãs João tem?</label><br>
                <br>
                <label for="V">63</label>
                <input type="radio" name="Soma1" value="63">
                <label for="F">42</label>
                <input type="radio" name="Soma1" value="42">
                <label for="F">72</label>
                <input type="radio" name="Soma1" value="72">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 5">Desafio 5</label><br>
                <label for="Soma2">Complete a frase usando a palavra correta para o artigo (o, a, um): A professora deu
                    _____ livro para cada aluno.</label><br>
                <br>
                <label for="F">o</label>
                <input type="radio" name="Soma2" value="o">
                <label for="F">a</label>
                <input type="radio" name="Soma2" value="A">
                <label for="V">um</label>
                <input type="radio" name="Soma2" value="um">
                <br>
            </div>
            <br>

        </fieldset>
        <fieldset>
            <div>
                <label for="Pista 6">Desafio 6</label><br>
                <label for="Soma3">Hélio tem 81 figurinhas e quer distribuí-las igualmente entre 9 páginas do seu álbum.
                    Quantas figurinhas cada página terá?</label><br>
                <br>
                <label for="F">7</label>
                <input type="radio" name="Soma3" value="7">
                <label for="F">6</label>
                <input type="radio" name="Soma3" value="6">
                <label for="V">9</label>
                <input type="radio" name="Soma3" value="9">
                <br>
            </div>
            <br>
            <button type="button" onclick="Pista4()">Mostrar Resposta</button>
        </fieldset>

    </form>
    <script src="Desafio4.js"></script>

</body>

</html>
